name: Run UI Playwright E2E Tests

# ToDo should it be triggered only as part of an open PR?
# currently it triggers for any commit in a FB
on: 
  # to allow to wait for a e2e tests to be passed to proceed in another workflow
  workflow_call:
    inputs:
      # Example of node-version: 20.18.0
      node-version:
        required: true
        type: string
      is-ui-changed:
        required: false
        type: boolean
      is-cms-changed:
        required: false
        type: boolean
      # Example of service-subfolder-name usage: cms
      service-subfolder-name:
        required: true
        type: string
      # Example of playwright-config-name usage: playwright.e2e.config.ts
      playwright-config-name:
        required: false
        type: string
      # Example of env-vars usage: |
      #   FRONTEND_URL=http://localhost:40120
      #   CMS_URL=http://localhost:40120/cms
      env-vars:
        required: false
        type: string
  
jobs:
  run-playwright-e2e-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ["${{ inputs.node-version }}"]

    steps:
      - name: Checkout home-local-env
        uses: actions/checkout@v4
        with:
          # sparse-checkout is needed to clone service folder only
          # Cone mode is disabled to not clone other files in root folder
          # It's important to clone only this folder to keep the root folder clean
          sparse-checkout: |
            local-env
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Change UI refs and image tag
        uses: ./.github/actions/change-repository-refs-and-image-tag
        if: ${{ inputs.is-ui-changed }}
        with:
          path-to-values: local-env/deploy/values-ui.yaml.gotmpl
          service-name: ui
          image-tag: local-env-sha-${{ github.sha }}

      - name: Change CMS refs and image tag
        uses: ./.github/actions/change-repository-refs-and-image-tag
        if: ${{ inputs.is-cms-changed }}
        with:
          path-to-values: local-env/deploy/values-cms.yaml.gotmpl
          service-name: cms
          image-tag: sha-${{ github.sha }}

      - name: Deploy Local Env to Kind k8s
        uses: devcontainers/ci@v0.3
        with:
          subFolder: local-env
          # In the current configuration we store services as subfolders 
          # and it's necessary to define path to the devcontainer config in the folder of needed service
          configFile: ./local-env/.devcontainer/devcontainer.json
          runCmd: |
            kind create cluster --name home --config kind-local-config.yaml --kubeconfig ./.home-cluster-kubeconfig
            
            export KUBECONFIG=$(pwd)/.home-cluster-kubeconfig

            helmfile --environment local --namespace local -f deploy/helmfile.yaml apply
          push: never

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # sparse-checkout is needed to clone service folder only. 
          # Cone mode is disabled to not clone other files in root folder
          # It's important to clone only this folder to keep the root folder clean
          # Because we will move service subfolder to the root in the next step 
          sparse-checkout: '${{ inputs.service-subfolder-name }}'
          sparse-checkout-cone-mode: false

        # This step is needed because all steps runs from root folder and there are several options how to solve this problem
        # Option #1: change working-directory of each step
        # Option #2: move subfolder to root folder
        # Option #2 was chosen because it allows the folder to be moved in a single action
        # It seems a good option to move subfolder to the root folder because we are not going to commit anything from this workflow
      - name: Move subfolder to current(top-level) folder
        run: |
          mv ${{ inputs.service-subfolder-name }}/{.,}* .
          rm -rf ${{ inputs.service-subfolder-name }}

      - name: Cache node modules
        id: cache-nodemodules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
  
      # let's cache the binaries of installed browsers that we don't re-install them every time from scratch
      - name: Cache playwright browsers
        id: cache-playwrightbrowsers
        uses: actions/cache@v4
        env:
          cache-name: cache-playwright-browsers
        with:
          # caching browsers binaries
          # this path is taken from here https://playwright.dev/docs/browsers#managing-browser-binaries
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Playwright Browsers
        if: steps.cache-playwrightbrowsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Playwright run
        env:
          ENV_VARS: ${{ inputs.env-vars }}
        run: |
          export $(printf '%s\n' "$ENV_VARS" | xargs)

          export PLAYWRIGHT_CONFIG=${{ inputs.playwright-config-name && format('--config={0}', inputs.playwright-config-name) || '' }}

          npx playwright test $PLAYWRIGHT_CONFIG --reporter=list,html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 7