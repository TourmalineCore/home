name: Run UI Playwright E2E Tests

# ToDo should it be triggered only as part of an open PR?
# currently it triggers for any commit in a FB
on: 
  # to allow to wait for a e2e tests to be passed to proceed in another workflow
  workflow_call:
    inputs:
      # Example of node-version: 20.18.0
      node-version:
        required: true
        type: string
      is-ui-changed:
        required: false
        type: boolean
      is-cms-changed:
        required: false
        type: boolean
      service-subfolder-name:
        required: true
        type: string
      playwright-config-name:
        required: false
        type: string
      env-vars:
        required: false
        type: string
  
jobs:
  run-playwright-e2e-tests:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        node-version: ["${{ inputs.node-version }}"]

    steps:
      - name: Checkout home-local-env
        uses: actions/checkout@v4
        with:
          # sparse-checkout is needed to clone service folder only
          # Cone mode is disabled to not clone other files in root folder
          # It's important to clone only this folder to keep the root folder clean
          sparse-checkout: 'local-env'
          sparse-checkout-cone-mode: false

      - name: Check deploy files before changes
        run: |
          ls
          cat local-env/deploy/values-ui.yaml.gotmpl
          cat local-env/deploy/helmfile.yaml
          cat local-env/deploy/values-cms.yaml.gotmpl

      - name: Deploy Local Env to Kind k8s
        uses: devcontainers/ci@v0.3
        with:
          subFolder: local-env
          # In the current configuration we store services as subfolders 
          # and it's necessary to define path to the devcontainer config in the folder of needed service
          configFile: ./local-env/.devcontainer/devcontainer.json
          runCmd: |
            # we need to override "latest" image tag of service inside local-env to run e2e against the current commit service version and not against latest from master
            # We tried to use yq to change the image tag, but in the values files for helmfile we have non-yaml code that yq can`t parse or ignore
            # so for that reason we use Stream EDitor which can find needed string using regular expressions and change it to a new value
            # The -i flag is needed to write new image tag directly to values file

            if [[ "${{ inputs.is-ui-changed }}" == "true" ]]; then
            sed -i "0,/tag:.*/s//tag: \"local-env-sha-${{ github.sha }}\"/" deploy/values-ui.yaml.gotmpl
            
            # we need to override "latest" ref of service chart inside local-env to run tests against the current commit service chart version and not against latest from master
            sed -i "0,/ui?ref=.*/s//ui?ref=${{ github.sha }}/" deploy/helmfile.yaml
            
            # This changes values file ref in the helmfile.yaml
            sed -i "0,/ui\/ci\/values.yaml?ref=.*/s//ui\/ci\/values.yaml?ref=${{ github.sha }}/" deploy/helmfile.yaml
            fi

            if [[ "${{ inputs.is-cms-changed }}" == "true" ]]; then
            sed -i "0,/tag:.*/s//tag: \"sha-${{ github.sha }}\"/" deploy/values-cms.yaml.gotmpl

            sed -i "0,/cms?ref=.*/s//cms?ref=${{ github.sha }}/" deploy/helmfile.yaml
            
            sed -i "0,/cms\/ci\/values.yaml?ref=.*/s//cms\/ci\/values.yaml?ref=${{ github.sha }}/" deploy/helmfile.yaml
            fi

            kind create cluster --name home --config kind-local-config.yaml --kubeconfig ./.home-cluster-kubeconfig
            
            export KUBECONFIG=$(pwd)/.home-cluster-kubeconfig

            helmfile --environment local --namespace local -f deploy/helmfile.yaml apply
          push: never

      - name: Check deploy files after changes
        run: |
          cat local-env/deploy/values-ui.yaml.gotmpl
          cat local-env/deploy/helmfile.yaml
          cat local-env/deploy/values-cms.yaml.gotmpl


      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # sparse-checkout is needed to clone service folder only. 
          # Cone mode is disabled to not clone other files in root folder
          # It's important to clone only this folder to keep the root folder clean
          # Because we will move service subfolder to the root in the next step 
          sparse-checkout: '${{ inputs.service-subfolder-name }}'
          sparse-checkout-cone-mode: false

        # This step is needed because all steps runs from root folder and there are several options how to solve this problem
        # Option #1: change working-directory of each step
        # Option #2: move subfolder to root folder
        # Option #2 was chosen because it allows the folder to be moved in a single action
        # It seems a good option to move subfolder to the root folder because we are not going to commit anything from this workflow
      - name: Move subfolder to current(top-level) folder
        run: |
          mv ${{ inputs.service-subfolder-name }}/{.,}* .
          rm -rf ${{ inputs.service-subfolder-name }}

      - name: Cache node modules
        id: cache-nodemodules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
  
      # let's cache the binaries of installed browsers that we don't re-install them every time from scratch
      - name: Cache playwright browsers
        id: cache-playwrightbrowsers
        uses: actions/cache@v4
        env:
          cache-name: cache-playwright-browsers
        with:
          # caching browsers binaries
          # this path is taken from here https://playwright.dev/docs/browsers#managing-browser-binaries
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Playwright Browsers
        if: steps.cache-playwrightbrowsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Playwright run
        env:
          ENV_VARS: ${{ inputs.env-vars }}
        run: |
          export $(printf '%s\n' "$ENV_VARS" | xargs)
          env
          npx playwright test --config=playwright.e2e.config.ts --reporter=list,html
        

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 7