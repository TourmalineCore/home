name: Publish Docker Image

on: 
  workflow_call:
    inputs:
      is-ui-changed:
        required: false
        type: boolean
      is-cms-changed:
        required: false
        type: boolean

        
jobs:  
  push-ui-local-env-to-registry:
    if: ${{ inputs.is-ui-changed }}
    uses: ./.github/workflows/.reusable-docker-build-and-push.yml
    with:
      context: ./ui
      image-name: home-ui
      # We use CDN at prod, that enabling or disabling only during build and can't be enabled/disabled at runtime.   
      # Prefix is used to build several images, the first one with disabled CDN for Local Env
      # the second and the third ones with enabled CDN and different CDN_DOMAIN's for Prod and Staging Envs
      prefix: "local-env"
      # Build-args used to define variables that will be used in image
      build-args: |
        CDN_ENABLED=false
        NEXT_PUBLIC_ENABLE_SMARTCAPTCHA=false

  push-cms-to-registry:
    if: ${{ inputs.is-cms-changed }}
    uses: ./.github/workflows/.reusable-docker-build-and-push.yml
    with:
      context: ./cms
      image-name: home-cms
      # Build-args is used to define variables that will be used in image
      build-args: |
        # this perfectly explains why this is needed https://github.com/strapi/strapi/issues/13889#issuecomment-1516194973
        SERVER_URL=/cms
    # without this it cannot login to the registry
    secrets: inherit

        

        