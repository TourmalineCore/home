name: Run Home Playwright E2E Tests

on: 
  push:
    branches:
      - feature/*
    paths:
      - 'ui/**'
      - 'cms/**'

jobs:
  detect-changed-services:
    runs-on: ubuntu-24.04
    outputs:
      ui: ${{ steps.detect-changed-services.outputs.ui }}
      cms: ${{ steps.detect-changed-services.outputs.cms }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed services
        uses: dorny/paths-filter@v4
        id: detect-changed-services
        with:
          filters: |
            ui:
              - 'ui/**'
            cms:
              - 'cms/**'

  push-to-registry:
    needs: detect-changed-services
    uses: ./.github/workflows/docker-build-and-push-orchestrator.yml
    with:
      is-ui-changed: ${{ needs.detect-changed-services.outputs.ui == 'true'}}
      is-cms-changed: ${{ needs.detect-changed-services.outputs.cms == 'true'}}

  run-ui-playwright-tests:
    if: needs.detect-changed-services.outputs.ui == 'true'
    needs: [detect-changed-services, push-to-registry]
    uses: ./.github/workflows/.reusable-playwright-e2e-tests.yml
    with:
      is-ui-changed: true
      is-cms-changed: ${{ needs.detect-changed-services.outputs.cms == 'true'}}
      service-subfolder-name: ui
      node-version: 20.18.0
      env-vars: |
        FRONTEND_URL=http://localhost:40120
        CMS_URL=http://localhost:40120/cms
        CMS_EMAIL=admin@init-strapi-admin.strapi.io
        CMS_PASSWORD=admin

  run-cms-playwright-tests:
    if: needs.detect-changed-services.outputs.cms == 'true'
    needs: [detect-changed-services, push-to-registry]
    uses: ./.github/workflows/.reusable-playwright-e2e-tests.yml
    with:
      is-ui-changed: ${{ needs.detect-changed-services.outputs.cms  == 'true'}}
      is-cms-changed: true
      service-subfolder-name: cms
      node-version: 22.18.0
      env-vars: |
        SERVER_URL=http://localhost:40120/cms